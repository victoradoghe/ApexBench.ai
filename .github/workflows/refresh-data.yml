name: Refresh live data

# Re-snapshots OpenRouter pricing/context/uptime and our own measured speed
# probes (probes need OPENROUTER_API_KEY with credits), then rebuilds the
# static site so "live" stays live.
#
# This job covers the model REGISTRY only. Arena ratings come from played
# matches and are handled by arena-season.yml — the two never mix.
on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh live snapshot
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/refresh-live.mjs
      - name: Rebuild site
        run: pnpm build
      - name: Commit updated snapshot
        run: |
          git config user.name "apexbench-bot"
          git config user.email "bot@apexbench.dev"
          git add src/data/live.json
          git diff --cached --quiet || git commit -m "chore: refresh live data snapshot"
          git push
